{% extends "base.html" %}

{% block title %}Edit Service - TalentNest{% endblock %}

{% block content %}

<div class="page-container">

    <h3 class="page-title">
        <i class="bi bi-pencil-square"></i> Edit Service
    </h3>

    <p class="page-subtitle">
        Update the details of your service.
    </p>

    <div class="tn-card p-4">

        <form method="POST"
              action="{{ url_for('edit_service', service_id=service.id) }}"
              enctype="multipart/form-data">

            <!-- SERVICE NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Service Name
                </label>

                <input type="text"
                       class="form-control"
                       name="service_name"
                       value="{{ service.service_name }}"
                       required>

            </div>


            <!-- CATEGORY -->

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select class="form-select"
                        name="category_id"
                        required>

                    {% for cat in categories %}

                    <option value="{{ cat.id }}"
                        {% if cat.id == service.category_id %}selected{% endif %}>

                        {{ cat.category_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea class="form-control"
                          name="description"
                          rows="3">{{ service.description }}</textarea>

            </div>


            <!-- PRICE -->

            <div class="mb-3">

                <label class="form-label">
                    Price (&#8377;)
                </label>

                <input type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       name="price"
                       value="{{ service.price }}"
                       required>

            </div>


            <!-- IMAGE -->

            <div class="mb-4">

                <label class="form-label">
                    Service Image
                </label>

                {% if service.image %}

                <div class="mb-2">

                    <img src="{{ url_for('static', filename='uploads/' + service.image) }}"
                         style="height:100px; width:100px; object-fit:cover;"
                         class="rounded"
                         alt="Current service image">

                </div>

                {% endif %}

                <input type="file"
                       class="form-control"
                       name="image"
                       accept=".jpg,.jpeg,.png">

                <small class="text-muted">
                    Leave empty to keep the current image.
                </small>

            </div>


            <!-- BUTTONS -->

            <button type="submit"
                    class="btn btn-tn-primary">

                <i class="bi bi-check-circle"></i>
                Save Changes

            </button>

            <a href="{{ url_for('my_services') }}"
               class="btn btn-tn-outline">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
