{% extends "base.html" %}

{% block title %}Add Service - TalentNest{% endblock %}

{% block content %}

<div class="page-container">

    <h3 class="page-title">
        <i class="bi bi-plus-circle"></i> Add New Service
    </h3>

    <p class="page-subtitle">
        Add a new service that you want to offer on TalentNest.
    </p>

    <div class="tn-card p-4">

        <form method="POST"
              action="{{ url_for('add_service') }}"
              enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Service Name</label>
                <input type="text"
                       class="form-control"
                       name="service_name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select class="form-select"
                        name="category_id"
                        required>

                    <option value="" disabled selected>
                        -- Select Category --
                    </option>

                    {% for cat in categories %}
                        <option value="{{ cat.id }}">
                            {{ cat.category_name }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea class="form-control"
                          name="description"
                          rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Price (&#8377;)</label>

                <input type="number"
                       step="0.01"
                       min="0"
                       class="form-control"
                       name="price"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label">Service Image</label>

                <input type="file"
                       class="form-control"
                       name="image"
                       accept=".jpg,.jpeg,.png">
            </div>

            <button type="submit" class="btn btn-tn-primary">
                <i class="bi bi-check-circle"></i>
                Add Service
            </button>

            <a href="{{ url_for('my_services') }}"
               class="btn btn-tn-outline">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
