{% extends "base.html" %}

{% block title %}Reset Password - TalentNest{% endblock %}

{% block content %}

<div class="forgot-page">

    <div class="forgot-card">

        <h3 class="page-title text-center mb-2">
            <i class="bi bi-shield-lock"></i> Reset Password
        </h3>

        <p class="text-muted text-center mb-4">
            Create a new password for your account.
        </p>


        <form method="POST"
              action="{{ url_for('reset_password', token=token) }}">

            <div class="mb-3">

                <label class="form-label">
                    New Password
                </label>

                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter new password"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm New Password
                </label>

                <input type="password"
                       class="form-control"
                       name="confirm_password"
                       placeholder="Confirm new password"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-tn-primary w-100">

                <i class="bi bi-check-circle"></i>
                Reset Password

            </button>

        </form>

    </div>

</div>

{% endblock %}
