{% extends "base.html" %}

{% block title %}Login - TalentNest{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h3 class="section-title text-center mb-4">
            <i class="bi bi-box-arrow-in-right"></i>
            Login
        </h3>

        <form method="POST">

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        id="loginPassword"
                        required
                    >

                    <span
                        class="input-group-text password-toggle"
                        onclick="togglePasswordVisibility('loginPassword', 'loginPasswordIcon')"
                    >
                        <i
                            class="bi bi-eye"
                            id="loginPasswordIcon"
                        ></i>
                    </span>

                </div>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-tn-primary w-100"
            >
                Login
            </button>

        </form>


        <!-- Login Links -->
        <div class="login-links">

            <a href="{{ url_for('forgot_password') }}">
                Forgot password?
            </a>

            <span>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Register here
                </a>
            </span>

        </div>

    </div>

</div>

{% endblock %}
