{% extends "base.html" %}
{% block title %}Error {{ code }} - TalentNest{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-emoji-frown display-1" style="color: var(--tn-purple);"></i>
  <h2 class="mt-3 section-title">{{ code }}</h2>
  <p class="lead text-muted">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-tn-primary mt-2">Go Home</a>
</div>
{% endblock %}
